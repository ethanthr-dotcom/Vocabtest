<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测试中 · 词汇量测试</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="brand">
      <img src="assets/logo.svg" alt="logo">
      <span>词汇量测试</span>
    </div>
    <nav>
      <a href="index.html" data-page="home">首页</a>
      <a href="history.html" data-page="history">历史</a>
    </nav>
  </header>

  <main class="page">
    <div class="card">
      <div class="test-progress-wrap">
        <div class="test-progress-label">
          <span>第 <span id="qNum">0</span> / <span id="qTotal">50</span> 题</span>
          <span id="thetaHint">正在定位水平…</span>
        </div>
        <div class="test-progress-bar">
          <div id="progressFill" class="test-progress-fill"></div>
        </div>
      </div>

      <div class="test-word-card">
        <div id="qTypeHint" class="test-word-hint">你认识这个词吗?</div>
        <div id="word" class="test-word pop">…</div>
      </div>

      <!-- 认识/不认识 题型 -->
      <div id="knowButtons" class="test-buttons">
        <button id="btnNo" class="btn btn-unknown btn-lg">不认识</button>
        <button id="btnYes" class="btn btn-known btn-lg">认识</button>
      </div>

      <!-- 释义选择 题型 -->
      <div id="meaningButtons" class="meaning-options hidden"></div>

      <div id="encourage" class="test-encourage"></div>
    </div>
  </main>

  <script src="js/algorithm.js"></script>
  <script src="js/app.js"></script>
  <script src="js/test.js"></script>
</body>
</html>
